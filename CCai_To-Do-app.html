<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Att göra</title>
  <meta name="theme-color" content="#0d2344">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lobster+Two&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --panel:#122F5C;
      --blue-d:#122F5C;
      --green:#125E2F;
      --green-d:#0D4522;
      --ink:#fff;
      --mute:#aebbd6;
      --rule:#c7d2e8;
      --fi:#0D2345;
      color-scheme:dark;
      box-sizing:border-box;
      padding-top:env(safe-area-inset-top,0px);
      padding-bottom:env(safe-area-inset-bottom,0px)
    }
    *,*::before,*::after{box-sizing:inherit}
    html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
    body{margin:0;height:100%;background:#0d2344 linear-gradient(180deg,#143d80,#0d2344 55%,#0a1a36) no-repeat fixed;color:var(--ink);font:15px/1.35 "Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-emoji:text}
    button,input,select,textarea{font:inherit;color:inherit}
    button{cursor:pointer}
    :focus-visible{outline:2px solid #ffd54a;outline-offset:2px}
    #app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column}
    header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 12px}
    h1{margin:0;font-size:22px;font-weight:400}
    .av{width:46px;height:46px;border-radius:50%;border:0;background:#1fa04b;padding:0}
    .body{flex:1;min-height:0;display:flex;padding:0 16px}
    .rail{flex:none;width:60px;display:flex;flex-direction:column;gap:6px;overflow-y:auto;scrollbar-width:none}
    .tab{flex:1;min-height:104px;background:var(--green);border-radius:8px 0 0 8px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 0 2px}
    .tab{background:linear-gradient(90deg,#1b6b3b,#0f4a27)}
    .tab.on{background:linear-gradient(90deg,#0d2150,#13316b)}
    .tab.more.on .plus{background:#0f2350;box-shadow:0 0 0 1px #2b5fb8}
    .tab.more.on .tb svg *{stroke:#c9ffc0}
    .tab:not(.more){justify-content:flex-start;gap:2px;padding-top:12px;min-height:84px}
    .tab .val{min-height:28px;font-size:15px}
    .f{margin-top:16px;background:#0d2350;border-radius:10px;padding:12px 12px 14px}
    .lb{display:flex;align-items:center;gap:8px;background:none;padding:0 0 8px;border-radius:0;font-size:18px}
    .in{border-radius:8px;background:#efefef;min-height:48px}
    .f .chip{background:#173a7a}
    .f .sg{background:#efefef;color:#16233f;border-radius:8px;min-height:48px}
    .f .sg.on{border-color:#22a355;box-shadow:inset 0 0 0 1px #22a355}
    .act{justify-content:center}.act button{flex:0 1 190px;background:#22a355}.act .dng{background:#7a1c1c}
    .ttl{display:flex;justify-content:space-between;align-items:center;border-bottom:1.5px solid var(--rule);padding-bottom:8px;margin-bottom:4px;font-size:22px}
    details summary{list-style:none}details summary::after{content:"";display:block;width:9px;height:9px;margin:8px auto 0;border:solid var(--mute);border-width:0 2px 2px 0;transform:rotate(45deg)}details[open] summary::after{transform:rotate(-135deg)}
    .tg{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0 0;font-size:16px}
    .tg i{width:64px;height:34px;border-radius:17px;background:#f2f2f2;position:relative}
    .tg i::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#0d2350}
    .tg.on i{background:#22a355}.tg.on i::after{left:34px}
    .tg span{opacity:.5}.tg:not(.on) span:first-child,.tg.on span:last-child{opacity:1}
    .ic{flex:none}.ci{display:inline-flex}
    .cols .ib{width:42px;height:42px;border-radius:8px;background:#efefef;color:#16233f;display:grid;place-items:center;padding:0}
    .cols .ib.on{border-color:#22a355}
    .tab.more{flex:1.2}
    .tb,.plus,.arr button{background:none;border:0;padding:0;color:#fff}
    .val{font-size:14px}
    .arr{display:flex}
    .arr button{width:28px;height:28px;font-size:16px}
    .plus{width:34px;height:34px;margin-bottom:8px;border-radius:6px;background:var(--green-d);font-size:28px;line-height:1}
    .panel{flex:1;min-width:0;background:var(--panel);border-radius:0 8px 8px 8px;overflow-y:auto;padding:16px 16px 24px}
    footer{display:flex;gap:16px;padding:10px 16px 12px}
    footer button{flex:1;min-height:48px;border:0;border-radius:6px;background:var(--blue-d);font-size:16px}
    .h2{margin:0 0 2px;font-size:19px;font-weight:400}
    .hello{font:22px/1.35 "Lobster Two",cursive,serif;margin:2px 0 8px}
    .psst{font:16px/1.4 "Lobster Two",cursive,serif;margin:10px 0 18px}
    .sh{display:flex;justify-content:space-between;align-items:center;border-bottom:1.5px solid var(--rule);padding:8px 0 6px;margin:14px 0 4px;font-size:14px}
    .sh.big{font-size:19px;margin-top:18px}
    .row,.cl{display:flex;align-items:center;gap:10px;min-height:44px}
    .open{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:none;border:0;padding:6px 0;text-align:left}
    .open .t{flex:1;min-width:0}
    .open small{display:block;color:var(--mute);font-size:11.5px}
    .done .t b{text-decoration:line-through;opacity:.6}
    .go{color:var(--mute);padding-right:4px}
    .pi{flex:none;width:24px;height:24px;display:inline-grid;place-items:center;border:2px solid;border-radius:3px;background:#fff;font-size:13px;line-height:1;padding:0}
    .p1{color:#c1121f;border-color:#c1121f}
    .p2{color:#e0a800;background:#fff6cf;border-color:#f1dc85}
    .p3{color:#143d80;border-color:#143d80}
    .pi.d{background:#2fa35b;border-color:#2fa35b;color:#fff;border-radius:50%}
    .empty{color:var(--mute);margin:18px 0}
    .srch{width:100%;background:none;border:0;border-bottom:1.5px solid var(--rule);font-size:19px;padding:4px 0 8px;outline-offset:4px}
    .srch::placeholder{color:#fff;opacity:1}
    .sc{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:8px -16px 0;padding:0 16px 8px;scroll-padding-inline:16px}
    .lc{flex:none;width:74%;scroll-snap-align:start;border-radius:6px;padding:10px 12px 6px}
    .lc h3{margin:0 0 4px;padding-bottom:4px;font-size:17px;font-weight:600;display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.4)}
    .lc .cl{min-height:38px}
    .more-b{display:block;margin:2px 0 0 auto;background:none;border:0;padding:6px 0;font-size:14px}
    .f{display:block;margin-top:12px}
    .lb{display:inline-block;background:var(--green-d);padding:5px 14px;border-radius:8px 8px 0 0;font-size:18px}
    .in{display:block;width:100%;min-height:46px;border:0;border-radius:0 6px 6px 6px;background:#fff;color:var(--fi);padding:10px 14px;font-size:16px}
    textarea.in{min-height:90px;resize:vertical}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .seg{display:flex;gap:8px;flex-wrap:wrap}
    .sg{flex:1;min-height:46px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--green-d);border:2px solid transparent;border-radius:6px;padding:0 8px;font-size:14px}
    .sg.on{border-color:#fff;background:#1b6b3b}
    .sw{width:100%}
    .chip{display:flex;align-items:center;gap:8px;margin-top:8px;background:var(--green-d);border-radius:6px;padding:6px 10px;font-size:14px}
    .chip button{margin-left:auto;background:none;border:0;font-size:14px;text-decoration:underline}
    .chip img{width:56px;height:56px;object-fit:cover;border-radius:4px}
    .cols{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
    .cols button{width:40px;height:40px;border-radius:50%;border:3px solid transparent}
    .cols button.on{border-color:#fff}
    .act{display:flex;gap:10px;margin-top:20px}
    .act button{flex:1;min-height:48px;border:0;border-radius:6px;background:var(--green);font-size:16px}
    .act .dng{background:#7a1c1c}
    .err{background:#5a1220;border:1px solid #e5484d;border-radius:6px;padding:8px 12px;margin-top:14px}
    #toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:var(--fi);padding:10px 16px;border-radius:20px;font-size:14px;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s}
    #toast.on{opacity:1}
    .sb{display:flex;justify-content:space-between;align-items:center;padding:6px 18px 0;font-size:13px}
    .sbr{display:flex;gap:8px;align-items:center}
    .bat,.bdg{border-radius:10px;padding:0 7px;font-size:12px;background:#e9eefb;color:#13316b}
    .bdg{background:#ff6b8b;color:#fff}.bdg:empty{display:none}
    .ck{flex:none;width:24px;height:24px;border:2px solid #cfd9ee;border-radius:5px;background:transparent;padding:0;overflow:hidden;display:inline-grid;place-items:center;color:#3ddc84;font-size:22px;line-height:1}
    .ck i{display:block;width:100%;height:100%;background:linear-gradient(135deg,#ffd54a 50%,transparent 50%)}
    .ck.s2{border-color:transparent}
    .done .t b{color:#8a96b0}
    .sh{background:#0c2150;border:0;border-radius:8px;padding:8px 10px}
    .hl{background:none;border:0;padding:0;font-weight:600;font-size:17px;text-align:left}
    .sub{display:flex;gap:6px;margin-top:6px}.sub button{background:none;border:0;width:36px}
    details summary{cursor:pointer;margin-top:18px;color:var(--mute);text-align:center}
    #dlg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,12,30,.6);z-index:5;padding:20px}
    #dlg[hidden]{display:none}
    #dlg .box{background:var(--panel);border-radius:12px;padding:20px;max-width:340px;width:100%}
    .fx{position:fixed;inset:0;pointer-events:none;z-index:9}
    .chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chipb{border:0;border-radius:16px;padding:6px 14px}
    @media(min-width:720px){#app{max-width:980px}.sc{flex-wrap:wrap;overflow:visible;margin:8px 0 0;padding:0}.lc{width:calc(33.3% - 8px)}.panel{padding:20px 28px 28px}.rail{width:76px}.f,.act,details{max-width:560px}}
    @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
<div id="app">
<div class="sb" aria-hidden="true"><span id="clk"></span><span class="sbr"><span class="bdg" id="bdg"></span><span class="bat">100</span></span></div>
<header><h1 id="date"></h1><button class="av" data-v="me" aria-label="Ändra namn"><svg viewBox="0 0 46 46" width="46" height="46" aria-hidden="true"><circle cx="23" cy="19" r="9" fill="none" stroke="#0b2a14" stroke-width="2"/><circle cx="20" cy="17" r="1.3" fill="#0b2a14"/><circle cx="26" cy="17" r="1.3" fill="#0b2a14"/><path d="M19 22q4 3 8 0M23 28v8M23 31l-7 3M23 31l7 -4" fill="none" stroke="#0b2a14" stroke-width="2" stroke-linecap="round"/></svg></button></header>
<div class="body"><nav class="rail" id="rail" aria-label="Vyer"></nav><main class="panel" id="panel"></main></div>
<footer><button data-v="newlist">+ Ny lista</button><button data-v="add">+ Ny uppgift</button></footer>
</div>
<div id="dlg" hidden role="dialog" aria-modal="true" aria-labelledby="dq"><div class="box"><p id="dq" class="h2">Är uppgiften slutförd?</p><div class="act"><button data-act="yes">Ja</button><button data-act="no">Inte än</button></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const WD=['söndag','måndag','tisdag','onsdag','torsdag','fredag','lördag'],WS=['sön','mån','tis','ons','tors','fre','lör'],MO=['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'];
const COL=['#6a1616','#1d6b3a','#0f2350','#7a4b12','#7a1c1c','#1d4f7a','#4a2a73'];
const G={1:'▼',2:'✺',3:'✦'},PL=['','Högst prioritet!','Vill gärna få gjort detta:','Om tid finns vore det toppen att…'];
const cap=s=>s[0].toUpperCase()+s.slice(1),pad=n=>String(n).padStart(2,'0'),uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const addM=(d,n)=>{const m=d.getMonth()+n,dim=new Date(d.getFullYear(),m+1,0).getDate();return new Date(d.getFullYear(),m,Math.min(d.getDate(),dim))};
const adv=(d,r)=>r==='day'?addD(d,1):r==='week'?addD(d,7):addM(d,r==='year'?12:1);
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const isoWeek=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),k=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-k);const y=t.getUTCFullYear();return[y,Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7)]};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const KEY='todo.v1';
let S,V='home',prevV='home',A=today(),draft=null,ldraft=null,curList=null,qs='',armed='',lastV='',tt;

function seed(){const t=today(),d=n=>iso(addD(t,n));
 const L=(id,name,group,color,icon)=>({id,name,group,color,icon:icon||''});
 const T=(list,title,prio,due,x)=>Object.assign({id:uid(),list,title,prio,due,time:'',est:'',remind:false,rec:'',desc:'',img:'',file:null,tags:'',done:false},x);
 return{name:'Hedda',lists:[L('plugga','Plugga','viktig','#6a1616','🎓'),L('stada','Städa','viktig','#1d6b3a'),L('bilen','Bilen','fav','#0f2350','♥'),L('ekonomi','Ekonomi','fav','#1d6b3a'),L('traning','Träning','other','#7a4b12','★'),L('lagenhet','Lägenheten','other','#7a1c1c'),L('djuren','Djuren','other','#1d4f7a'),L('handla','Handla','other','#4a2a73')],
 tasks:[T('stada','Badrum',1,d(0)),T('djuren','Mata',1,d(0),{time:'08:00',rec:'day',remind:true}),T('handla','Middag',2,d(0),{est:30}),T('stada','Kök',3,d(0)),T('handla','Frukost',3,d(0)),T('plugga','Prov!',1,d(2)),T('plugga','Öva engelska',2,d(1),{est:45}),T('bilen','Tvätta bilen',3,d(4)),T('bilen','Vinterdäck',2,d(-1),{done:true}),T('ekonomi','Hyra',2,d(3),{rec:'month'}),T('ekonomi','Mobil',2,d(9)),T('traning','Promenad',2,d(1),{est:40}),T('traning','Gymma',3,d(3)),T('lagenhet','Ny matta',3,''),T('lagenhet','Tapetsera',3,'')]}}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}if(!S||!S.tasks)S=seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Det gick inte att spara. Lagringen är full.')}}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2600)}
const LI=id=>S.lists.find(l=>l.id===id)||{name:'?',color:'#333'};

const pi=(p,s)=>`<span class="pi p${p}" aria-hidden="true">${G[p]}</span>`;
function cal(l){return`<svg viewBox="0 0 44 38" width="44" height="38" aria-hidden="true"><path d="M12 2v6M32 2v6" stroke="#0f4a27" stroke-width="2.5" stroke-linecap="round"/><rect x="2" y="6" width="40" height="30" rx="3" fill="#2fa35b"/><rect x="2" y="6" width="40" height="11" rx="3" fill="#0f4a27"/><text x="22" y="15" text-anchor="middle" font-size="9" fill="#fff" font-family="Open Sans,sans-serif">${l}</text><path d="M7 24h30M7 30h30" stroke="#d9f5e3" stroke-width="3" stroke-dasharray="2 2.2"/></svg>`}
const tbl='<svg viewBox="0 0 28 28" width="30" height="30" aria-hidden="true"><rect x="3" y="4" width="22" height="20" rx="2" fill="none" stroke="#fff" stroke-width="2"/><path d="M3 11h22M3 17.5h22M11 4v20" stroke="#fff" stroke-width="2"/></svg>';

function drawRail(){const m=MO[A.getMonth()];
 const P=[['day','Dag',A.getDate()+'/'+(A.getMonth()+1)],['week','Vecka','v '+isoWeek(A)[1]],['month','Månad',cap(m).slice(0,3)+'.']];
 const lv=['cats','list','add','newlist'].includes(V);
 $('#rail').innerHTML=P.map(([k,l,v])=>`<div class="tab${V===k||(k==='day'&&V==='home')?' on':''}"><button class="tb val" data-v="${k}" aria-label="${l}vy">${v}</button><div class="arr"><button data-n="${k}:-1" aria-label="Föregående ${l.toLowerCase()}">←</button><button data-n="${k}:1" aria-label="Nästa ${l.toLowerCase()}">→</button></div></div>`).join('')
 +`<div class="tab more${lv?' on':''}"><button class="tb" data-v="cats" aria-label="Alla listor">${tbl}</button><button class="plus" data-v="add" aria-label="Ny uppgift">+</button></div>`;
 const t=new Date();$('#date').textContent=cap(WD[t.getDay()])+', '+t.getDate()+' '+MO[t.getMonth()]}

function meta(t,wd){const d=t.due&&wd?WS[parse(t.due).getDay()]+' '+parse(t.due).getDate()+'/'+(parse(t.due).getMonth()+1):'';
 return[d,t.time&&'kl '+t.time,t.est&&t.est+' min',t.rec&&'återkommer',t.remind&&'påminnelse'].filter(Boolean).join(', ')}
function row(t,sl,wd){const m=meta(t,wd);
 return`<div class="row${t.done?' done':''}"><button class="pi p${t.prio}${t.done?' d':''}" data-d="${t.id}" aria-label="${t.done?'Markera som ej klar':'Markera som klar'}: ${esc(t.title)}">${t.done?'✓':G[t.prio]}</button><button class="open" data-e="${t.id}"><span class="t"><b>${sl?esc(LI(t.list).name)+' &gt; ':''}${esc(t.title)}</b>${m?`<small>${esc(m)}</small>`:''}</span><span class="go" aria-hidden="true">&gt;</span></button></div>`}
const sortT=(a,b)=>(a.done-b.done)||(a.due||'9').localeCompare(b.due||'9')||(a.time||'').localeCompare(b.time||'');
function groups(ts,sl,wd){if(!ts.length)return'<p class="empty">Inga uppgifter här än. Tryck på + Ny uppgift för att lägga till en.</p>';
 ts=[...ts].sort(sortT);return[1,2,3].map(p=>{const g=ts.filter(t=>t.prio===p);return g.length?`<div class="sh"><span>${PL[p]}</span>${pi(p)}</div>`+g.map(t=>row(t,sl,wd)).join(''):''}).join('')}

function welcome(){const d=iso(today());
 return`<p class="hello">Välkommen, ${esc(S.name)}!<br>Med hjälp från dina listor kommer du att få mycket gjort idag!</p>
<svg viewBox="0 0 300 36" width="100%" height="36" aria-hidden="true"><path d="M4 20C40 4 70 36 110 18S190 4 230 20s50 8 66 -4" fill="none" stroke="#c7d2e8" stroke-width="1.3"/><g fill="none" stroke="#c7d2e8" stroke-width="1.1"><ellipse cx="50" cy="14" rx="9" ry="4" transform="rotate(-30 50 14)"/><ellipse cx="95" cy="27" rx="9" ry="4" transform="rotate(30 95 27)"/><ellipse cx="150" cy="12" rx="9" ry="4" transform="rotate(-25 150 12)"/><ellipse cx="205" cy="14" rx="9" ry="4" transform="rotate(25 205 14)"/><ellipse cx="262" cy="22" rx="9" ry="4" transform="rotate(-20 262 22)"/></g></svg>
<p class="psst">Psst!<br>Växla mellan flikarna för att se dina uppgifter &amp; listor!</p>
<div class="sh big"><span>Dagens uppgifter:</span></div>`}
function inRange(t){if(!t.due)return false;const d=parse(t.due);if(V==='day')return t.due===iso(A);
 if(V==='week'){const a=isoWeek(d),b=isoWeek(A);return a[0]===b[0]&&a[1]===b[1]}return d.getFullYear()===A.getFullYear()&&d.getMonth()===A.getMonth()}
function period(){const h=V==='day'?(iso(A)===iso(today())?'Dagens uppgifter:':cap(WD[A.getDay()])+' '+A.getDate()+' '+MO[A.getMonth()]):V==='week'?'Vecka '+isoWeek(A)[1]:cap(MO[A.getMonth()])+' '+A.getFullYear();
 return`<h2 class="h2">${h}</h2>`+groups(S.tasks.filter(inRange),true,V!=='day')}

function card(l,ts){ts=[...ts].sort(sortT);const n=ts.length;

 $('#hb').innerHTML=h}
function taskV(){const t=S.tasks.find(x=>x.id===curT);if(!t){V='home';return home()}const m=meta(t,1);
 return`<h2 class="h2">${esc(LI(t.list).name)} &gt; ${esc(t.title)}</h2><div class="row">${chk(t)}${pi(t.prio)}<span class="t">${['Ej påbörjad','Påbörjad','Slutförd'][t.st]}</span></div>${m?`<p class="empty" style="margin:4px 0">${esc(m)}</p>`:''}${t.desc?`<p>${esc(t.desc)}</p>`:''}
${t.subs.length?`<div class="sh"><span>Deluppgifter</span></div>`+t.subs.map((s,i)=>`<div class="row${s.d?' done':''}"><button class="ck s${s.d?2:0}" data-sub="${i}" aria-label="Växla delmål: ${esc(s.t)}">${s.d?'★':''}</button><span class="t"><b>${esc(s.t)}</b></span></div>`).join(''):''}
${t.img?`<img src="${t.img}" alt="Bifogad bild" style="max-width:100%;border-radius:8px;margin-top:10px">`:''}${t.file?`<div class="chip"><span>${esc(t.file.name)}</span>${t.file.data?`<a href="${t.file.data}" download="${esc(t.file.name)}" style="margin-left:auto;color:#fff">Öppna</a>`:''}</div>`:''}${t.tags?`<p class="empty">${esc(t.tags)}</p>`:''}
<div class="act"><button data-v="${bk}">Tillbaka</button><button data-act="edit">Ändra</button></div>`}
function meV(){return`<h2 class="h2">Inställningar</h2>${f('Namn:',inp('name',S.name))}
<div class="f"><span class="lb">Ljud:</span><button type="button" class="sg sw${S.mute?'':' on'}" role="switch" aria-checked="${!S.mute}" data-act="snd">${S.mute?'Av':'På'}</button></div>
<div class="f"><span class="lb">Bjud in att se dina listor:</span><div class="two"><input class="in" data-g="inv" type="email" placeholder="namn@epost.se" aria-label="E-postadress" value="${esc(inv)}"><button class="sg" data-act="invite">Bjud in</button></div>${S.inv.map((e,i)=>`<div class="chip"><span>${esc(e)}</span><button type="button" data-act="rminv" data-a="${i}">Ta bort</button></div>`).join('')}<button class="sg sw" style="margin-top:10px" data-act="copy">Kopiera länk till appen</button></div>
<p class="empty">Inbjudningar och uppgifter sparas just nu bara på den här enheten. För live-delning mellan användare krävs en delad databas.</p>`}
function form(){const d=draft,R=[['','Aldrig'],['day','Varje dag'],['week','Varje vecka'],['month','Varje månad'],['year','Varje år']];
 return`<h2 class="h2 ttl">${d.id?'Ändra uppgift':'Ny uppgift…'}<span>${ico('pencil',16)}</span></h2>
${f('heart|Uppgift *',inp('title',d.title))}
${f('list|Lista *',`<select class="in" data-f="list">${S.lists.map(l=>`<option value="${l.id}"${d.list===l.id?' selected':''}>${esc(l.name)}</option>`).join('')}<option value="new"${d.list==='new'?' selected':''}>+ Ny lista…</option></select>`)}
${d.list==='new'?f('list|Listrubrik *',inp('newName',d.newName)):''}
<div class="f"><span class="lb">${ico('star')} Prioritet *</span><div class="seg" role="group" aria-label="Prioritet">${[1,2,3].map(p=>`<button type="button" class="sg${d.prio===p?' on':''}" data-p="${p}" aria-pressed="${d.prio===p}">${pi(p)} ${['','Först','Sedan','Om tid'][p]}</button>`).join('')}</div></div>
${f('clock|Uppskattad tid (min) *',`<input class="in" type="number" min="1" step="5" inputmode="numeric" data-f="est" value="${esc(d.est)}">`)}
<div class="f"><span class="lb">${ico('bell')} Påminnelse *</span><button type="button" class="tg${d.remind?' on':''}" role="switch" aria-checked="${d.remind}" aria-label="Påminnelse" data-act="rem"><span>Av</span><i></i><span>På</span></button></div>
<details${d.id||d.od?' open':''}><summary>Du kan lägga till valfria detaljer</summary>
<div class="f"><span class="lb">${ico('alarm')} Deadline</span><div class="two"><input class="in" type="date" data-f="due" value="${esc(d.due)}" aria-label="Datum"><input class="in" type="time" data-f="time" value="${esc(d.time)}" aria-label="Tid"></div></div>
${f('Återkommande',`<select class="in" data-f="rec">${R.map(([v,l])=>`<option value="${v}"${d.rec===v?' selected':''}>${l}</option>`).join('')}</select>`)}
${f('pencil|Beskrivning',`<textarea class="in" data-f="desc" placeholder="Skriv här…">${esc(d.desc)}</textarea>`)}
<div class="f"><span class="lb">${ico('list')} Deluppgifter</span>${d.subs.map((s,i)=>`<div class="sub"><input class="in" data-s="${i}" value="${esc(s.t)}" placeholder="Delmål…" aria-label="Deluppgift ${i+1}"><button type="button" data-act="rmsub" data-a="${i}" aria-label="Ta bort deluppgift">✕</button></div>`).join('')}<button type="button" class="sg sw" style="margin-top:8px" data-act="addsub">+ Lägg till deluppgift</button></div>
<div class="f"><span class="lb">${ico('camera')} Bifoga bild</span><input class="in" type="file" accept="image/*" data-up="img">${d.img?`<div class="chip"><img src="${d.img}" alt="Bifogad bild"><button type="button" data-act="rmimg">Ta bort</button></div>`:''}</div>
<div class="f"><span class="lb">${ico('camera')} Bifoga fil</span><input class="in" type="file" data-up="file">${d.file?`<div class="chip"><span>${esc(d.file.name)}</span><button type="button" data-act="rmfile">Ta bort</button></div>`:''}</div>
${f('hash|Extra #sökord',inp('tags',d.tags).replace('Skriv här…','#hemma, #brådskande'))}</details>
${d.err?`<div class="err" role="alert">${esc(d.err)}</div>`:''}
<div class="act"><button data-act="save">Spara uppgift</button>${d.id?`<button class="dng" data-act="del">${armed==='d'?'Tryck igen för att ta bort':'Ta bort'}</button>`:''}</div>`}
function saveTask(){const d=draft;let L=d.list;
 if(!d.title.trim())return fail('Skriv vad som ska göras i fältet Uppgift.');
 if(L==='new'&&!d.newName.trim())return fail('Skriv en listrubrik för den nya listan.');
 if(!(+d.est>0))return fail('Ange uppskattad tid i minuter.');
 if(L==='new'){L=uid();S.lists.push({id:L,name:d.newName.trim(),group:'other',color:COL[S.lists.length%COL.length],icon:''})}
 const{err,newName,od,...t}=d;t.list=L;t.title=t.title.trim();t.subs=t.subs.filter(s=>s.t.trim());t.done=t.st===2;
 if(t.id){S.tasks[S.tasks.findIndex(x=>x.id===t.id)]=t}else{t.id=uid();S.tasks.push(t)}
 save();toast('Uppgiften sparades');if(t.due){A=parse(t.due);V='day'}else{curList=L;V='list'}render()}
function go(v,id){prevV=V;V=v;armed='';
 if(v==='add')draft=id?JSON.parse(JSON.stringify(S.tasks.find(t=>t.id===id))):blank();
 if(v==='task'){curT=id;bk=['add','task'].includes(prevV)?bk:prevV}
 if(v==='newlist')ldraft={name:'',group:'other',color:COL[S.lists.length%COL.length]};
 render()}
function draw(){const p=$('#panel'),top=lastV===V?p.scrollTop:0;
 p.innerHTML=V==='home'?home():['day','week','month'].includes(V)?period():V==='cats'?cats():V==='list'?listView():V==='add'?form():V==='newlist'?listForm():V==='task'?taskV():meV();
 if(V==='cats')fillCats();if(V==='home')fillHome();p.scrollTop=top;lastV=V}
function sb(){const n=new Date(),k=iso(today());$('#clk').textContent=pad(n.getHours())+':'+pad(n.getMinutes());const c=S.tasks.filter(t=>t.st!==2&&t.due&&t.due<=k).length;$('#bdg').textContent=c||''}
function render(){drawRail();draw();sb()}
function tap(id){const t=S.tasks.find(x=>x.id===id);
 if(t.st===0){t.st=1;toast('Påbörjad')}
 else if(t.st===1){cfm=id;$('#dq').textContent='Är ”'+t.title+'” slutförd?';$('#dlg').hidden=false;$('#dlg [data-act=yes]').focus();return}
 else{t.st=0;t.done=false;toast('Ångrad')}
 save();render()}
function fin(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;
 if(t.rec&&t.due){t.due=iso(adv(parse(t.due),t.rec));t.st=0;t.done=false;toast('Klart! Nästa gång: '+parse(t.due).getDate()+' '+MO[parse(t.due).getMonth()])}else{t.st=2;t.done=true}
 save();render();const all=S.tasks.filter(x=>x.list===t.list).every(x=>x.st===2);party(all?2:1,all?'Hela listan '+LI(t.list).name+' är klar!':null)}
function sound(lv){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t0=AC.currentTime+.02,big=lv>1,out=AC.createGain();out.gain.value=.9;out.connect(AC.destination);
 const horn=(f,s,len,g)=>{[1,2,3].forEach(m=>{const o=AC.createOscillator(),fl=AC.createBiquadFilter(),v=AC.createGain(),a=g/(m*1.4);o.type='sawtooth';o.frequency.value=f*m;fl.type='lowpass';fl.frequency.setValueAtTime(900,t0+s);fl.frequency.linearRampToValueAtTime(2600,t0+s+.08);fl.frequency.linearRampToValueAtTime(1500,t0+s+len);v.gain.setValueAtTime(0,t0+s);v.gain.linearRampToValueAtTime(a,t0+s+.03);v.gain.setValueAtTime(a,t0+s+len-.08);v.gain.linearRampToValueAtTime(0,t0+s+len);o.connect(fl);fl.connect(v);v.connect(out);o.start(t0+s);o.stop(t0+s+len+.02)})};
 (big?[[523,0,.14],[523,.16,.14],[523,.32,.14],[659,.5,.3],[784,.85,.3],[1047,1.2,1]]:[[523,0,.12],[523,.14,.12],[523,.28,.12],[784,.45,.7]]).forEach(([f,s,len])=>horn(f,s,len,.09));
 
 
 }catch(e){}}
function soundOld(lv){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime;
 const tone=(f,s,d,ty,g)=>{const o=AC.createOscillator(),v=AC.createGain();o.type=ty;o.frequency.value=f;v.gain.setValueAtTime(g,t0+s);v.gain.exponentialRampToValueAtTime(.001,t0+s+d);o.connect(v).connect(AC.destination);o.start(t0+s);o.stop(t0+s+d)};
 if(lv===1){[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.25,'triangle',.15));try{const u=new SpeechSynthesisUtterance('Jiihoo!');u.lang='sv-SE';u.pitch=1.6;u.rate=1.1;speechSynthesis.speak(u)}catch(e){}}
 else{[[392,0],[392,.18],[392,.36],[523,.54],[659,.9],[784,1.25]].forEach(([f,s])=>{tone(f,s,.5,'sawtooth',.1);tone(f*2,s,.5,'square',.04)});
  const n=AC.sampleRate*3,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(Math.random()<.03?1:.25)*Math.min(1,i/9e3)*Math.max(0,1-i/n);
  const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),v=AC.createGain();s.buffer=b;fl.type='bandpass';fl.frequency.value=2500;v.gain.value=.5;s.connect(fl).connect(v).connect(AC.destination);s.start(t0+1.2)}}catch(e){}}
function party(lv,msg){if(msg)toast(msg);if(!S.mute)sound(lv);if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const c=document.createElement('canvas');c.className='fx';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);
 const x=c.getContext('2d'),end=Date.now()+(lv>1?4500:1800),P=[];
 for(let i=0;i<(lv>1?220:90);i++)P.push({x:Math.random()*c.width,y:-Math.random()*c.height*.6,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:2+Math.random()*4,c:['#ffd54a','#3ddc84','#ff6b8b','#6ec6ff','#fff'][Math.random()*5|0],a:Math.random()*6});
 (function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx+Math.sin(p.a+=.1);p.y+=p.vy;if(p.y>c.height&&Date.now()<end){p.y=-10;p.x=Math.random()*c.width}x.fillStyle=p.c;x.fillRect(p.x,p.y,p.r,p.r*1.6)});if(P.some(p=>p.y<c.height))requestAnimationFrame(f);else c.remove()})()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-e],[data-x],[data-lv],[data-sub],[data-act],[data-d]');if(!b)return;const D=b.dataset,a=D.act;let h=true;
 if(D.d)tap(D.d);
 else if(D.e)go('task',D.e);
 else if(D.x){OPEN[D.x]=!OPEN[D.x];draw()}
 else if(D.lv){curList=D.lv;go('list')}
 else if(D.sub!==undefined){const t=S.tasks.find(x=>x.id===curT);t.subs[+D.sub].d=!t.subs[+D.sub].d;save();draw()}
 else if(a==='yes'){const i=cfm;cfm=null;$('#dlg').hidden=true;fin(i)}
 else if(a==='no'){cfm=null;$('#dlg').hidden=true}
 else if(a==='edit')go('add',curT);
 else if(a==='addsub'){draft.subs.push({t:'',d:false});draft.od=true;draw();const s=document.querySelectorAll('[data-s]');if(s.length)s[s.length-1].focus()}
 else if(a==='rmsub'){draft.subs.splice(+D.a,1);draft.od=true;draw()}
 else if(a==='ico'){ldraft.icon=D.a;draw()}
 else if(a==='snd'){S.mute=!S.mute;save();draw()}
 else if(a==='invite'){const v=inv.trim();if(/^\S+@\S+\.\S+$/.test(v)){S.inv.push(v);inv='';save();draw();toast('Inbjudan sparad')}else toast('Skriv en giltig e-postadress.')}
 else if(a==='rminv'){S.inv.splice(+D.a,1);save();draw()}
 else if(a==='copy'){try{navigator.clipboard.writeText(location.href).then(()=>toast('Länken kopierades'),()=>toast('Kunde inte kopiera länken'))}catch(x){toast('Kunde inte kopiera länken')}}
 else h=false;
 if(h)e.stopImmediatePropagation()},true);
document.addEventListener('input',e=>{const t=e.target;if(t.id==='hq'){qs=t.value;fillHome()}else if(t.dataset.s!==undefined)draft.subs[+t.dataset.s].t=t.value;else if(t.dataset.g==='inv')inv=t.value});
document.addEventListener('toggle',e=>{if(e.target.tagName==='DETAILS'&&draft&&V==='add')draft.od=e.target.open},true);
render();setInterval(sb,3e4);try{navigator.getBattery().then(b=>{$('.bat').textContent=Math.round(b.level*100)})}catch(e){}
</script>
</body>
